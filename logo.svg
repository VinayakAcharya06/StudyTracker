<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#e0e7ff" stop-opacity="0.75" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield Container -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bgGrad)" />
  
  <!-- Subtle Inner Glass Border -->
  <rect x="48" y="48" width="416" height="416" rx="92" fill="none" stroke="white" stroke-width="8" stroke-opacity="0.25" />

  <!-- Open Book Symbol -->
  <path d="M128 326 C 176 306, 224 316, 256 334 C 288 316, 336 306, 384 326 V 182 C 336 162, 288 172, 256 190 C 224 172, 176 162, 128 182 Z" fill="url(#bookGrad)" />
  <path d="M256 190 V 334" stroke="#4f46e5" stroke-width="8" stroke-linecap="round" opacity="0.3" />

  <!-- Dynamic Lightning Bolt Motif -->
  <path d="M276 104 L192 264 H252 L232 400 L320 236 H260 Z" fill="url(#boltGrad)" filter="url(#glow)" />
</svg>
